  <script>
    // Load the Nike catalogue (assets/nike/catalog.json), then open a step from the URL (#board, #card, #study/preview …) or the board
    loadCatalog().then(() => {
      // ?screen=edge/single works like #edge/single, for links whose hash is taken (e.g. Figma captures)
      // ?shot=N (tour/tour.js) opens tour step N's screen on its own, keeping only the photos seen on opening
      // ?shot=N (tour/tour.js) opens tour step N's screen alone, with only the photos seen on opening, for Figma captures
      const [hf, ho] = (new URLSearchParams(location.search).get("screen") || location.hash.slice(1)).split("/");
      if (flowById(hf)) { setFlow(hf); JUMP[hf](ho || null); } else JUMP.board(null);
      document.dispatchEvent(new Event("app:ready"));
    });
  </script>

  <script>
    // Load the Nike catalogue (assets/nike/catalog.json), then open a step from the URL (#board, #card, #study/preview …) or the board
    loadCatalog().then(() => {
      const [hf, ho] = location.hash.slice(1).split("/");
      if (flowById(hf)) { setFlow(hf); JUMP[hf](ho || null); } else JUMP.board(null);
      document.dispatchEvent(new Event("app:ready"));
    });
  </script>

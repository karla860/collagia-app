<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Import Preview · Collagia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    /* Official Collagia palette (Figma "Colors" frame) */
    :root {
      --text: #232121; --muted: #6E6D7A; --border: #E4E4E4; --surface: #FFFFFF;
      --g1: #ECECED; --g2: #F1F1F1; --g3: #F9FAFB;
      --red: #E83832; --soft: #FDEFEF;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 "Inter", system-ui, sans-serif; color: var(--text); background: var(--g3); -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; cursor: pointer; }
    a { color: inherit; }
    svg.i { width: 16px; height: 16px; flex: none; }
    .sp { flex: 1; }

    /* App shell behind the modal */
    .shell { display: flex; min-height: 100vh; filter: blur(1px); }
    .side { width: 228px; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 12px; }
    .side .logo { font-size: 22px; font-weight: 700; margin: 0 8px 24px; }
    .side ul { margin: 0; padding: 0; }
    .side li { list-style: none; padding: 9px 12px; border-radius: 4px; font-weight: 500; }
    .side li.on { background: var(--g1); }
    .shell main { flex: 1; padding: 24px; }
    .shell h1 { margin: 0; font-size: 24px; }
    .dim { position: fixed; inset: 0; background: rgba(26, 25, 25, .5); display: flex; align-items: center; justify-content: center; padding: 64px 24px 24px; }

    /* Iteration switcher (prototype only) */
    .proto { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: var(--surface); border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.25); white-space: nowrap; }
    .proto .lab { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--red); margin-right: 4px; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .seg button { border: 0; background: var(--surface); height: 28px; padding: 0 10px; font-size: 12.5px; color: var(--muted); }
    .seg button.on { background: var(--g1); color: var(--text); }
    .seg button b { margin-right: 2px; }

    /* Modal */
    .m { width: min(1200px, 100%); height: min(640px, 100%); background: var(--surface); border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; overflow: hidden; }
    .hd { display: grid; gap: 10px; padding: 16px 16px 12px; }
    .hd.line { border-bottom: 1px solid var(--border); }
    .title { display: flex; align-items: center; gap: 10px; }
    .icon-btn { border: 0; background: none; padding: 4px; border-radius: 4px; display: grid; }
    .icon-btn:hover { background: var(--g1); }
    .htitle { margin: 0; font-size: 20px; font-weight: 400; color: var(--text); }
    .htitle b { font-weight: 600; }
    .crumbs { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 500; color: var(--muted); }
    .crumbs a { text-decoration: underline; text-underline-offset: 3px; color: var(--muted); }
    .crumbs a:hover { color: var(--text); }
    .crumbs b { color: var(--text); font-weight: 600; }
    .file { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--g2); font-size: 12.5px; color: var(--muted); }
    .file b { color: var(--text); font-weight: 500; font-family: var(--mono); font-size: 12px; }
    /* Preview notice: neutral, not red */
    .dry { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; background: var(--g3); border: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
    .dry b { color: var(--text); font-weight: 600; }
    .body { flex: 1; min-height: 0; overflow: auto; background: var(--surface); }
    .ft { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
    .ft .note { font-size: 12.5px; color: var(--muted); }
    .ft .note b { color: var(--text); }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.06); white-space: nowrap; text-decoration: none; }
    .btn:hover { background: var(--g3); }
    .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.primary:hover { filter: brightness(.94); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .link { font-size: 12.5px; color: var(--muted); text-decoration: underline; cursor: pointer; background: none; border: 0; padding: 0; }
    .flab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

    /* Change marks — monochrome: removed is struck through, changed shows old → new, added is outlined */
    .chg { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 3px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--g2); color: var(--text); }
    .chg.rm { color: var(--muted); }
    .chg.rm s { text-decoration-thickness: 1px; }
    .chg.mv s { color: var(--muted); }
    .chg.add { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
    .chg i { font-style: normal; font-weight: 600; color: var(--muted); }
    .counts { display: flex; gap: 6px; }

    /* Value diff: one merged list */
    .vdiff { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .val { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12.5px; font-weight: 500; background: var(--g2); }
    .val.gone { color: var(--muted); text-decoration: line-through; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
    .val.new { background: var(--surface); box-shadow: inset 0 0 0 1px var(--text); }
    .val em { font-style: normal; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

    /* Item rows */
    .thumb { width: 40px; height: 40px; flex: none; border-radius: 6px; background: var(--g2); overflow: hidden; display: grid; place-items: center; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb svg { width: 70%; height: 70%; }
    .prow { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
    .prow .nm { display: grid; gap: 2px; min-width: 240px; }
    .prow .nm b { font-size: 13px; font-weight: 600; }
    .id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
    .more-row { padding: 10px 16px; font-size: 12.5px; color: var(--muted); }
    .sec-h { display: flex; align-items: center; gap: 8px; padding: 9px 16px; background: var(--g3); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--muted); position: sticky; top: 0; z-index: 1; }
    .sec-h b { color: var(--text); }

    /* Iteration 1 — impact summary (kept quiet: greys only) */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 4px 16px 16px; }
    .kpi { padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); display: grid; gap: 4px; }
    .kpi span { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .kic { width: 24px; height: 24px; border-radius: 6px; background: var(--g2); color: var(--text); display: inline-grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 600; }
    .kpi b { font-size: 22px; font-weight: 600; }
    .atable { margin: 0 16px 16px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .arow { display: grid; grid-template-columns: 180px 1fr auto auto; gap: 16px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .arow:last-child { border-bottom: 0; }
    .arow .an { font-weight: 600; }
    .arow .vs { font-size: 12.5px; color: var(--muted); }
    .adetail { padding: 12px 14px 4px; background: var(--g3); border-bottom: 1px solid var(--border); display: grid; gap: 10px; }
    .adetail .rows { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
    .adetail .prow:last-child { border-bottom: 0; }

    /* Iteration 3 — review tabs */
    .tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab { display: inline-flex; align-items: center; gap: 7px; padding: 10px 12px; border: 0; border-bottom: 2px solid transparent; background: none; font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
    .tab .n { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 8px; background: var(--g1); color: var(--muted); }
    .tab:hover { color: var(--text); }
    .tab.on { color: var(--text); font-weight: 600; border-bottom-color: var(--red); }
    .tab.on .n { background: var(--soft); color: var(--red); }
    .dhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .vdivider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    /* Change-type sections as dropdown lists */
    .dd { border-bottom: 1px solid var(--border); }
    .dd-h { width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px 16px; border: 0; background: var(--surface); text-align: left; font-size: 13px; }
    .dd-h:hover { background: var(--g3); }
    .dd-h .chev { color: var(--muted); transform: rotate(-90deg); transition: transform .15s; }
    .dd.open .dd-h .chev { transform: none; }
    .dd-h > span:not(.sp):not(.dd-peek) { color: var(--muted); }
    .dd-peek { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .dd.open .dd-h { background: var(--g3); border-bottom: 1px solid var(--border); }
    .dd-b .prow:last-child { border-bottom: 0; }
    .dhead h3 { margin: 0; font-size: 16px; }

    /* Applied state */
    .done { height: 100%; display: grid; place-items: center; text-align: center; }
    .done > div { display: grid; justify-items: center; gap: 10px; max-width: 420px; }
    .done .badge { width: 56px; height: 56px; border-radius: 50%; background: var(--g2); color: var(--text); display: grid; place-items: center; }
    .done h2 { margin: 4px 0 0; font-size: 20px; }
    .done p { margin: 0; color: var(--muted); }
    .done .acts { display: flex; gap: 8px; margin-top: 8px; }

    @media (max-width: 900px) {
      .side { display: none; }
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .arow { grid-template-columns: 1fr; }
      .proto { left: 12px; right: 12px; transform: none; }
      .file { display: none; }
      .crumbs { font-size: 16px; }
    }
  </style>
</head>
<body>
  <!-- Garment silhouettes for items without a photo -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="tee" viewBox="0 0 64 64"><path d="M22 8 14 11 4 20l6 8 6-4v34h32V24l6 4 6-8-10-9-8-3c-2 4-6 6-10 6s-8-2-10-6z"/></symbol>
    <symbol id="long" viewBox="0 0 64 64"><path d="M22 8 12 12 6 56l8 1 4-31v32h28V26l4 31 8-1-6-44-10-4c-2 4-6 6-10 6s-8-2-10-6z"/></symbol>
    <symbol id="pants" viewBox="0 0 64 64"><path d="M18 6h28l4 52H37L32 22l-5 36H14z"/></symbol>
    <symbol id="shorts" viewBox="0 0 64 64"><path d="M16 14h32l4 32-16 2-4-18-4 18-16-2z"/></symbol>
    <symbol id="vest" viewBox="0 0 64 64"><path d="m24 8-6 4-2 12v34h32V24l-2-12-6-4c-2 6-5 8-8 8s-6-2-8-8z"/></symbol>
  </svg>

  <div class="shell" aria-hidden="true">
    <aside class="side"><div class="logo">Collagia</div><ul><li>Studies</li><li>Collages</li><li class="on">Attributes</li></ul></aside>
    <main><h1>Attributes</h1></main>
  </div>
  <div class="proto" id="proto"></div>
  <div class="dim"><div class="m" id="m" role="dialog" aria-modal="true" aria-label="Import preview"></div></div>

  <script>
    /* ---------- Items ---------- */
    // Solid items use the real product photos; patterned items use a garment silhouette
    const PHOTO = [["Dri-FIT training tee in Ecru","TOP_117"],["Performance tank in Terracotta","TAN_118"],["Windbreaker in Sienna","WBR_119"],["Longsleeve top in Apricot","TOP_120"],["Fleece crewneck in Camel","CRW_121"],["Dri-FIT training tee in Beige","TOP_122"],["Dri-FIT training tee in Orange","TOP_123"],["Sports Bra in Magenta","BRA_124"],["Fleece joggers in Sand","JOG_125"],["Biker shorts in Cinnamon","SRT_126"],["Track pants in Mustard","PNT_127"],["Sweatpants in Toffee","SWP_128"],["Fleece hoodie in Cognac","HOD_129"],["Puffer vest in Amber","VST_130"],["Track jacket in Brick Red","JKT_131"],["Training leggings in Rust","LEG_132"],["Half-zip pullover in Burnt Sienna","PUL_133"],["Sweatpants in Chestnut","SWP_134"]]
      .map(([name, id]) => ({ name, id, img: `assets/products/${id}.png` }));
    const DRAWN = (prefix, list) => list.map(([name, s, c], i) => ({ name, id: `${prefix}_${201 + i}`, s, c }));
    const ITEMS = {
      striped: DRAWN("STR", [["Breton longsleeve in Ecru","long","#C8C8C6"],["Pinstripe joggers in Grey","pants","#A3A3A3"],["Rugby stripe top in Forest","long","#4F8A5F"],["Breton tee in Navy","tee","#26365E"],["Pinstripe shorts in Stone","shorts","#B9B2A6"],["Rugby stripe hoodie in Rust","long","#B4472C"],["Breton tank in White","tee","#D7D7D7"],["Pinstripe trousers in Charcoal","pants","#4A4A4A"],["Rugby polo in Burgundy","tee","#7A2E3A"]]),
      floral: DRAWN("FLR", [["Ditsy floral tee in Sage","tee","#8FA585"],["Tropical print shorts in Coral","shorts","#D97C4A"],["Botanical sports top in Plum","tee","#7A3E6A"],["Paisley longsleeve in Ochre","long","#C9A227"],["Ditsy floral leggings in Black","pants","#3A3A3A"],["Tropical print vest in Teal","vest","#1F7A7A"],["Botanical hoodie in Cream","long","#E9E2CF"]]),
      graphic: DRAWN("GRP", [["Logo tee in Black","tee","#222222"],["Slogan hoodie in Heather Grey","long","#8D8D8F"],["Illustrated crewneck in Cobalt","long","#2F5BB7"],["Logo shorts in White","shorts","#E4E4E4"],["Typography tee in Sand","tee","#D4C3A6"],["Illustrated joggers in Olive","pants","#6B7A4A"]]),
      multi: DRAWN("MLT", [["Color-block windbreaker","long","#2F5BB7"],["Tie-dye training tee","tee","#D0368F"],["Ombré performance tank","tee","#F2A65A"],["Color-block joggers","pants","#B53A2E"],["Tie-dye hoodie","long","#7FC4A8"],["Ombré shorts","shorts","#E3B11F"],["Color-block vest","vest","#4A4F6A"],["Tie-dye joggers","pants","#9B6FB6"]]),
      plaid: DRAWN("PLD", [["Tartan flannel overshirt","long","#B53A2E"],["Gingham shorts in Sky","shorts","#8FB7D9"],["Buffalo check puffer vest","vest","#B53A2E"],["Tartan joggers","pants","#2F4F3A"],["Gingham tee in Red","tee","#D9534F"]]),
    };
    ITEMS.solid = PHOTO;

    /* ---------- Attributes in the import ---------- */
    // prev → next values; changes per item: rm (value removed), mv (old → new), add (value added)
    const mk = (items, plan) => plan.map(([type, from, to], i) => ({ type, item: items[i % items.length], from, to }));
    const ATTRS = [
      { k: "solid", label: "Solid", prev: ["Warm colors", "Cool colors", "Neutrals", "Pastels"], next: ["Warm colors", "Cool colors", "Neutrals"],
        changes: mk(ITEMS.solid, [
          ["rm", "Pastels"], ["rm", "Pastels"], ["rm", "Pastels"], ["rm", "Pastels"],
          ["mv", "Pastels", "Warm colors"], ["mv", "Pastels", "Neutrals"], ["mv", "Pastels", "Warm colors"], ["mv", "Pastels", "Warm colors"], ["mv", "Neutrals", "Warm colors"], ["mv", "Cool colors", "Warm colors"], ["mv", "Pastels", "Warm colors"], ["mv", "Pastels", "Warm colors"], ["mv", "Pastels", "Warm colors"],
          ["add", null, "Warm colors"], ["add", null, "Warm colors"], ["add", null, "Warm colors"], ["add", null, "Warm colors"], ["add", null, "Warm colors"]]) },
      { k: "striped", label: "Striped", prev: ["Breton", "Pinstripe"], next: ["Breton", "Pinstripe", "Rugby"],
        changes: mk(ITEMS.striped, [["mv", "Breton", "Rugby"], ["add", null, "Pinstripe"], ["add", null, "Rugby"], ["add", null, "Breton"], ["add", null, "Pinstripe"], ["mv", "Breton", "Rugby"], ["add", null, "Breton"], ["rm", "Pinstripe"], ["add", null, "Rugby"]]) },
      { k: "floral", label: "Floral", prev: ["Ditsy", "Tropical", "Botanical", "Paisley"], next: ["Ditsy", "Tropical", "Botanical"],
        changes: mk(ITEMS.floral, [["add", null, "Ditsy"], ["add", null, "Tropical"], ["mv", "Paisley", "Botanical"], ["rm", "Paisley"], ["add", null, "Ditsy"], ["add", null, "Tropical"], ["mv", "Paisley", "Botanical"]]) },
      { k: "graphic", label: "Graphic print", prev: ["Logo", "Typography", "Illustration"], next: ["Logo", "Typography", "Illustration"],
        changes: mk(ITEMS.graphic, [["add", null, "Logo"], ["mv", "Logo", "Typography"], ["add", null, "Illustration"], ["add", null, "Logo"], ["mv", "Illustration", "Typography"], ["add", null, "Illustration"]]) },
      { k: "multi", label: "Multicolored", prev: ["Color block", "Tie-dye"], next: ["Color block", "Tie-dye", "Ombré"],
        changes: mk(ITEMS.multi, [["add", null, "Color block"], ["add", null, "Tie-dye"], ["mv", "Color block", "Ombré"], ["add", null, "Color block"], ["add", null, "Tie-dye"], ["mv", "Tie-dye", "Ombré"], ["add", null, "Color block"], ["rm", "Tie-dye"]]) },
      { k: "plaid", label: "Plaid", prev: ["Tartan", "Gingham", "Buffalo check"], next: ["Tartan", "Gingham", "Buffalo check"],
        changes: mk(ITEMS.plaid, [["add", null, "Tartan"], ["add", null, "Gingham"], ["mv", "Tartan", "Buffalo check"], ["add", null, "Tartan"], ["mv", "Tartan", "Gingham"]]) },
    ];
    ATTRS.forEach(a => a.changes.forEach(c => c.a = a.k));
    const ALL = ATTRS.flatMap(a => a.changes);
    const attr = k => ATTRS.find(a => a.k === k);
    const TYPES = { rm: "Removed", mv: "Changed", add: "Added" };

    /* ---------- State ---------- */
    const read = (k, ok, d) => { try { const v = localStorage.getItem(k); return ok[v] ? v : d; } catch { return d; } };
    const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
    const ITERS = { "1": "Impact summary", "3": "Review by tabs" };
    const S = { iter: read("importIter2", ITERS, "1"), tab: "solid", open: new Set(), sec: new Set(), applied: false };

    /* ---------- Helpers ---------- */
    const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const ic = {
      back: '<svg class="i" style="width:18px;height:18px" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>',
      close: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>',
      info: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.25"/><path d="M8 7.25V11" stroke-linecap="round"/><circle cx="8" cy="5" r=".9" fill="currentColor" stroke="none"/></svg>',
      check: '<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>',
      file: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13"/></svg>',
      done: '<svg width="26" height="26" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>',
      items: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.75 14 5v6l-6 3.25L2 11V5z"/><path d="M2 5l6 3.25L14 5M8 8.25v6"/></svg>',
      chev: '<svg class="i chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg>',
  arrow: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9.5M9 4.5 12.5 8 9 11.5"/></svg>',
    };
    const thumb = it => `<span class="thumb">${it.img ? `<img src="${it.img}" alt="">` : `<svg style="fill:${it.c}"><use href="#${it.s}"/></svg>`}</span>`;
    const mark = c => c.type === "rm" ? `<span class="chg rm"><i>−</i><s>${esc(c.from)}</s></span>`
      : c.type === "add" ? `<span class="chg add"><i>+</i>${esc(c.to)}</span>`
      : `<span class="chg mv"><s>${esc(c.from)}</s> → ${esc(c.to)}</span>`;
    const counts = list => ({ rm: list.filter(c => c.type === "rm").length, mv: list.filter(c => c.type === "mv").length, add: list.filter(c => c.type === "add").length });
    const countChips = list => { const n = counts(list); return `<span class="counts">${n.rm ? `<span class="chg" title="Removed">− ${n.rm}</span>` : ""}${n.mv ? `<span class="chg" title="Changed">⇄ ${n.mv}</span>` : ""}${n.add ? `<span class="chg" title="Added">+ ${n.add}</span>` : ""}</span>`; };
    const valueDiff = a => {
      const gone = a.prev.filter(v => !a.next.includes(v)), added = a.next.filter(v => !a.prev.includes(v));
      return `<div class="vdiff">${a.prev.map(v => `<span class="val${gone.includes(v) ? " gone" : ""}"${gone.includes(v) ? ' title="Removed in this import"' : ""}>${esc(v)}</span>`).join("")}${added.map(v => `<span class="val new"><em>New</em>${esc(v)}</span>`).join("")}</div>`;
    };
    const legend = `<div class="legend"><span><i style="background:var(--g2)"></i>Kept</span><span><i style="box-shadow:inset 0 0 0 1px var(--border)"></i><s>Removed</s></span><span><i style="box-shadow:inset 0 0 0 1px var(--text)"></i>New</span></div>`;
    const valueSummary = a => {
      const gone = a.prev.filter(v => !a.next.includes(v)).length, added = a.next.filter(v => !a.prev.includes(v)).length;
      return [gone && `${gone} value removed`, added && `${added} new value`].filter(Boolean).join(" · ") || "Same values";
    };
    const affected = list => new Set(list.map(c => c.item.id)).size;
    const row = c => `<div class="prow">${thumb(c.item)}<div class="nm"><b>${esc(c.item.name)}</b><span class="id">${c.item.id}</span></div>${mark(c)}</div>`;
    const limit = (list, n) => list.slice(0, n).map(row).join("") + (list.length > n ? `<div class="more-row">+ ${list.length - n} more items</div>` : "");

    const header = ({ line = true } = {}) => `
      <div class="hd${line ? " line" : ""}">
        <div class="title">
          <a class="icon-btn" href="index.html" aria-label="Back">${ic.back}</a>
          <h2 class="htitle">Importing to <b>Consumer Preferences</b></h2>
          <span class="sp"></span>
          <a class="icon-btn" href="index.html" aria-label="Close">${ic.close}</a>
        </div>
        <div class="dry">${ic.info}<span>This is a preview. Nothing in <b>Consumer Preferences</b> changes until you apply the import.</span></div>
      </div>`;
    const applyBtn = (disabled = false) => `<button class="btn primary" data-a="apply"${disabled ? " disabled" : ""}>Apply ${ALL.length} changes</button>`;
    const footer = (note, disabled = false) => `<div class="ft"><span class="note">${note}</span><span class="sp"></span><a class="btn" href="index.html">Cancel</a>${applyBtn(disabled)}</div>`;

    /* ---------- Iterations ---------- */
    const VIEWS = {
      // 1 — what will this import do? Totals first, then one row per attribute
      "1": () => {
        const n = counts(ALL);
        return `${header()}
        <div class="body">
          <div class="kpis" style="padding-top:16px">
            <div class="kpi"><span><i class="kic">${ic.items}</i>Items affected</span><b>${affected(ALL)}</b></div>
            <div class="kpi"><span><i class="kic">−</i>Values removed</span><b>${n.rm}</b></div>
            <div class="kpi"><span><i class="kic">⇄</i>Values changed</span><b>${n.mv}</b></div>
            <div class="kpi"><span><i class="kic">+</i>Values added</span><b>${n.add}</b></div>
          </div>
          <div class="atable">${ATTRS.map(a => `
            <div class="arow">
              <span class="an">${a.label}</span>
              <span class="vs">${valueSummary(a)} · ${affected(a.changes)} items</span>
              ${countChips(a.changes)}
              <button class="btn" data-a="expand" data-k="${a.k}">${S.open.has(a.k) ? "Hide" : "Review"}</button>
            </div>
            ${S.open.has(a.k) ? `<div class="adetail"><div style="display:flex;align-items:center;gap:8px"><span class="flab">Values</span><span class="sp"></span>${legend}</div>${valueDiff(a)}
              <span class="flab">Item changes (${a.changes.length})</span><div class="rows">${limit(a.changes, 8)}</div></div>` : ""}`).join("")}
          </div>
        </div>
        ${footer(`<b>${ALL.length}</b> changes across <b>${ATTRS.length}</b> attributes`)}`;
      },

      // 3 — tabs on top for each attribute; values sit beside the title; each change type is a dropdown list
      "3": () => {
        const a = attr(S.tab);
        const groups = ["rm", "mv", "add"].map(t => [t, a.changes.filter(c => c.type === t)]).filter(([, l]) => l.length);
        return `${header()}
        <div class="tabs" role="tablist">${ATTRS.map(x => `<button class="tab${x.k === a.k ? " on" : ""}" role="tab" aria-selected="${x.k === a.k}" data-a="tab" data-k="${x.k}">${x.label}<span class="n">${x.changes.length}</span></button>`).join("")}</div>
        <div class="body">
          <div class="dhead">
            <span style="font-size:12.5px;color:var(--muted)">${affected(a.changes)} items</span>
            <span class="vdivider"></span><span class="flab">Values</span>${valueDiff(a)}
            <span class="sp"></span>${legend}
          </div>
          ${groups.map(([t, l]) => {
            const key = a.k + ":" + t, open = S.sec.has(key);
            return `<div class="dd${open ? " open" : ""}">
              <button class="dd-h" data-a="sec" data-k="${key}" aria-expanded="${open}">${ic.chev}<b>${TYPES[t]}</b><span>${l.length} item${l.length > 1 ? "s" : ""}</span>
                <span class="sp"></span><span class="dd-peek">${[...new Set(l.map(c => c.type === "rm" ? c.from : c.to))].map(v => `<span class="chg${t === "add" ? " add" : ""}">${t === "rm" ? `<i>−</i><s>${esc(v)}</s>` : (t === "add" ? `<i>+</i>` : "→ ") + esc(v)}</span>`).join("")}</span></button>
              ${open ? `<div class="dd-b">${limit(l, 12)}</div>` : ""}
            </div>`;
          }).join("")}
        </div>
        ${footer(`<b>${a.changes.length}</b> changes in ${a.label} · <b>${ALL.length}</b> in total`)}`;
      },
    };

    const applied = () => `${header()}
      <div class="body"><div class="done"><div>
        <span class="badge">${ic.done}</span>
        <h2>Import applied</h2>
        <p>${ALL.length} changes were applied to <b>Consumer Preferences</b> across ${affected(ALL)} items.</p>
        <div class="acts"><a class="btn primary" href="index.html">Back to Attributes</a></div>
        <button class="link" data-a="reset">Replay this prototype</button>
      </div></div></div>`;

    /* ---------- Render ---------- */
    const m = document.getElementById("m");
    const render = () => {
      m.innerHTML = S.applied ? applied() : VIEWS[S.iter]();
      document.getElementById("proto").innerHTML = `<span class="lab">Import preview</span><div class="seg">${Object.entries(ITERS).map(([id, l]) =>
        `<button class="${S.iter === id ? "on" : ""}" data-i="${id}"><b>${id}</b> ${l}</button>`).join("")}</div>`;
    };
    const reset = () => Object.assign(S, { tab: "solid", open: new Set(), sec: new Set(), applied: false });

    document.getElementById("proto").addEventListener("click", e => {
      const b = e.target.closest("[data-i]"); if (!b) return;
      S.iter = b.dataset.i; save("importIter2", S.iter); reset(); render();
    });
    m.addEventListener("click", e => {
      const a = e.target.closest("[data-a]"); if (!a) return;
      const { a: act, k } = a.dataset;
      switch (act) {
        case "tab": S.tab = k; break;
        case "expand": S.open.has(k) ? S.open.delete(k) : S.open.add(k); break;
        case "sec": S.sec.has(k) ? S.sec.delete(k) : S.sec.add(k); break;
        case "apply": S.applied = true; break;
        case "reset": reset(); break;
        default: return;
      }
      const body = m.querySelector(".body"); const top = body ? body.scrollTop : 0;
      render();
      const nb = m.querySelector(".body"); if (nb && (act === "expand" || act === "sec")) nb.scrollTop = top;
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") location.href = "index.html"; });
    render();
  </script>
</body>
</html>

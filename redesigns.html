<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid + Table Filters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #141414;
      --muted: #6b6b6b;
      --faint: #9a9a9a;
      --border: #e3e3e3;
      --surface: #fff;
      --sunken: #f4f4f3;
      --hover: #f5f5f4;
      --chip: #ececec;
      --accent: #ee3b33;
      --accent-soft: #fdecea;
      --radius: 6px;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 "Inter", system-ui, sans-serif; color: var(--text); background: #fafafa; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; cursor: pointer; }
    input { font: inherit; color: inherit; }
    svg.i { width: 16px; height: 16px; flex: none; }

    /* ---------- Page ---------- */
    .wrap { max-width: 1360px; margin: 0 auto; padding: 32px 40px 64px; }
    .wrap h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -0.4px; }
    .wrap > p { margin: 0 0 20px; color: var(--muted); }
    .styles { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .style-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 14px; min-width: 200px; text-align: left; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .style-btn b { font-size: 13.5px; }
    .style-btn span { font-size: 12px; color: var(--muted); }
    .style-btn.on { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
    .stage { background: #6e6e6e; border-radius: 12px; padding: 32px; overflow-x: auto; display: flex; justify-content: center; }
    .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 20px; }
    .notes h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .notes ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: #333; }
    .notes li { margin-bottom: 6px; }

    /* ---------- Modal ---------- */
    .m { width: 1200px; height: 640px; flex: none; background: var(--surface); border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .hd { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .hd .back { border: 0; background: none; padding: 4px; display: grid; }
    .hd h2 { margin: 0; flex: 1; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
    .hd h2 span { color: var(--muted); font-weight: 400; }
    .tb { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--border); min-height: 53px; }
    .tb .sp { flex: 1; }
    .tb2 { display: flex; align-items: center; gap: 6px; padding: 8px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; background: #fcfcfc; }
    .search { display: flex; align-items: center; gap: 8px; height: 32px; width: 210px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius); color: var(--faint); flex: none; }
    .search:focus-within { border-color: #999; }
    .search input { border: 0; outline: 0; width: 100%; font-size: 13px; background: none; }
    .meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    .meta b { color: var(--text); }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); font-size: 13.5px; white-space: nowrap; }
    .btn:hover { background: var(--hover); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.ghost { border-color: transparent; background: none; color: var(--muted); }
    .btn.ghost:hover { background: var(--hover); color: var(--text); }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .seg button { border: 0; background: var(--surface); height: 30px; padding: 0 12px; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
    .seg button.on { background: var(--chip); color: var(--text); }
    .body { flex: 1; overflow: auto; background: var(--sunken); }
    .ft { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; border-top: 1px solid var(--border); background: var(--surface); }
    .ft .actions { display: flex; gap: 8px; }
    .selbar { background: var(--text); color: #fff; }
    .selbar .meta { color: #bbb; }
    .selbar .meta b { color: #fff; }
    .selbar .btn { background: transparent; border-color: #444; color: #fff; }
    .selbar .btn.primary { background: var(--accent); border-color: var(--accent); }
    .selbar a { color: #fff; margin-left: 12px; font-size: 12.5px; cursor: pointer; text-decoration: underline; }

    /* Shared bits */
    .th { background: var(--bg); display: grid; place-items: center; overflow: hidden; border-radius: 4px; }
    .th svg { width: 62%; height: 62%; fill: var(--c); }
    .sku { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
    .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); display: inline-block; }
    .cb { width: 15px; height: 15px; border: 1.5px solid #bbb; border-radius: 4px; flex: none; display: grid; place-items: center; background: var(--surface); }
    .cb.on { background: var(--accent); border-color: var(--accent); }
    .cb.on::after { content: ""; width: 7px; height: 4px; border: solid #fff; border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg) translate(1px, -1px); }
    .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }

    /* Grid */
    .vgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; padding: 20px; }
    .vcard { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px; position: relative; cursor: pointer; }
    .vcard:hover { border-color: #ccc; }
    .vcard .th { aspect-ratio: 1; }
    .vcard h3 { margin: 8px 4px 2px; font-size: 13px; font-weight: 500; line-height: 1.3; min-height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .vcard .sku { display: block; margin: 0 4px 4px; }
    .vcard .attrs { display: flex; align-items: center; gap: 6px; margin: 0 4px 4px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
    .vcard .attrs .sw { width: 9px; height: 9px; }
    .vcard .pick { position: absolute; top: 12px; left: 12px; width: 20px; height: 20px; border-radius: 5px; background: rgba(255,255,255,.9); border: 1.5px solid #bbb; display: grid; place-items: center; opacity: 0; transition: opacity .1s; }
    .vcard:hover .pick, .vcard.sel .pick { opacity: 1; }
    .vcard.sel { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
    .vcard.sel .pick { background: var(--accent); border-color: var(--accent); }
    .vcard.sel .pick::after { content: ""; width: 9px; height: 5px; border: solid #fff; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }

    /* Table */
    table.t { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 13px; }
    .t th { position: sticky; top: 0; background: #fafafa; text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1; cursor: pointer; user-select: none; }
    .t th:hover, .t th.sorted { color: var(--text); }
    .t td { padding: 6px 12px; border-bottom: 1px solid #efefef; white-space: nowrap; }
    .t tbody tr { cursor: pointer; }
    .t tbody tr:hover td { background: #fafafa; }
    .t tr.on td { background: var(--accent-soft); }
    .t .prod { display: flex; align-items: center; gap: 10px; }
    .t .prod .th { width: 36px; height: 36px; }
    .t .tag { display: inline-flex; align-items: center; gap: 6px; }
    .t .w-cb { width: 36px; }

    .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); }
    .empty b { color: var(--text); font-size: 15px; }

    /* ---------- Popovers ---------- */
    .pop { position: absolute; z-index: 20; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.16); padding: 6px; width: 260px; }
    .pop-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .pop-h a, .link { font-size: 12px; font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; cursor: pointer; text-decoration: underline; }
    .pop-f { display: flex; justify-content: space-between; align-items: center; padding: 8px 6px 2px; margin-top: 4px; border-top: 1px solid var(--border); }
    .opt { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 6px; font-size: 13px; color: #333; cursor: pointer; }
    .opt:hover { background: var(--hover); }
    .opt .n { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
    .opt.zero { color: var(--faint); }
    .opt.cur { background: var(--hover); font-weight: 600; }
    .opt .chk { margin-left: auto; color: var(--accent); }
    .preset { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 8px 8px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
    .preset span { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); color: #555; cursor: pointer; }
    .preset span:hover { border-color: #bbb; }
    .preset span.on { background: var(--accent-soft); border-color: #f6c5c1; color: #b3261e; }
    .sep { height: 1px; background: var(--border); margin: 6px 0; }

    /* A — pill dropdowns */
    .pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font-size: 13px; color: #444; white-space: nowrap; }
    .pill:hover { border-color: #bbb; }
    .pill b { font-weight: 600; color: var(--text); }
    .pill.on { background: var(--text); border-color: var(--text); color: #ccc; }
    .pill.on b { color: #fff; }
    .pill.open { box-shadow: 0 0 0 3px rgba(0,0,0,.08); }
    .pill.add { border-style: dashed; color: var(--muted); }

    /* B — filter panel */
    .pop.panel { width: 500px; padding: 0; }
    .panel-body { display: flex; height: 300px; }
    .pane-l { width: 170px; border-right: 1px solid var(--border); padding: 6px; }
    .pane-r { flex: 1; padding: 6px; overflow: auto; }
    .pop.panel .pop-f { padding: 10px 12px; margin: 0; }
    .chip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px 0 10px; border-radius: 999px; background: var(--chip); font-size: 12.5px; color: #444; white-space: nowrap; cursor: pointer; }
    .chip b { color: var(--text); font-weight: 600; }
    .chip .x { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: #777; font-size: 14px; }
    .chip .x:hover { background: #dcdcdc; }

    /* C — query builder */
    .tok { display: inline-flex; align-items: stretch; height: 30px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; font-size: 13px; background: var(--surface); }
    .tok > * { display: flex; align-items: center; gap: 6px; padding: 0 9px; border: 0; border-right: 1px solid var(--border); background: none; white-space: nowrap; }
    .tok > *:last-child { border-right: 0; }
    .tok .k { font-weight: 600; cursor: default; background: #fafafa; }
    .tok .op { color: var(--muted); }
    .tok .op:hover, .tok .v:hover, .tok .x:hover { background: var(--hover); }
    .tok .v.empty-v { color: var(--faint); font-style: italic; }
    .tok .x { color: #888; padding: 0 7px; }
    .tok.neg .op { color: #b3261e; background: var(--accent-soft); }

    /* D — value chips */
    .atab { border: 0; background: none; height: 32px; padding: 0 10px; border-radius: var(--radius); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
    .atab:hover { background: var(--hover); color: var(--text); }
    .atab.on { background: var(--chip); color: var(--text); font-weight: 600; }
    .vchip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; color: #444; }
    .vchip:hover { border-color: #bbb; }
    .vchip .n { color: var(--faint); font-size: 11.5px; }
    .vchip.on { background: var(--text); border-color: var(--text); color: #fff; }
    .vchip.on .n { color: #aaa; }
    .vchip.zero { opacity: .45; }
    .vchip.preset-chip { border-style: dashed; }
    .vchip.preset-chip.on { border-style: solid; background: var(--accent-soft); border-color: #f6c5c1; color: #b3261e; }
    .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

    @media (max-width: 900px) {
      .wrap { padding: 20px 16px 48px; }
      .stage { padding: 16px; justify-content: flex-start; }
      .notes { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="tank" viewBox="0 0 64 64"><path d="M22 6v8c0 6-4 10-6 12v32h32V26c-2-2-6-6-6-12V6h-4c0 6-2 10-6 10s-6-4-6-10z"/></symbol>
    <symbol id="long" viewBox="0 0 64 64"><path d="M22 8 12 12 6 56l8 1 4-31v32h28V26l4 31 8-1-6-44-10-4c-2 4-6 6-10 6s-8-2-10-6z"/></symbol>
    <symbol id="pants" viewBox="0 0 64 64"><path d="M18 6h28l4 52H37L32 22l-5 36H14z"/></symbol>

  </svg>

  <div class="wrap">
    <h1>Consumer Preferences: Grid + Table</h1>
    <p>Pick a filter style and try it: open the dropdowns, tick values, search, sort, switch views and select products. Your filters carry over when you switch styles.</p>
    <div class="styles" id="styles"></div>
    <div class="stage" id="app"></div>
    <div class="notes" id="notes"></div>
  </div>

  <script>
    const items = [
      ["Dri-FIT training tee in Ecru","TOP_117","tee","#f1efe9","#5a5a5a","Neutral","Tops","Polyester","Training"],
      ["Performance tank in Terracotta","TAN_118","tank","#b4472c","#d9d1c4","Red","Tops","Polyester","Training"],
      ["Windbreaker in Sienna","WBR_119","long","#a5531f","#c9c6c0","Brown","Outerwear","Nylon","Outdoor"],
      ["Longsleeve top in Apricot","TOP_120","long","#f6b77e","#ece8e2","Orange","Tops","Cotton","Lifestyle"],
      ["Fleece crewneck in Camel","CRW_121","long","#b9874e","#e7e3dc","Brown","Tops","Fleece","Lifestyle"],
      ["Dri-FIT training tee in Beige","TOP_122","tee","#d9d2c6","#ebeae6","Neutral","Tops","Polyester","Training"],
      ["Dri-FIT training tee in Orange","TOP_123","tee","#ff7a2b","#c8c8c6","Orange","Tops","Polyester","Training"],
      ["Sports Bra in Magenta","BRA_124","bra","#d0368f","#e6e3de","Pink","Bras","Elastane","Training"],
      ["Fleece joggers in Sand","JOG_125","pants","#d4c3a6","#e9e6e0","Neutral","Bottoms","Fleece","Lifestyle"],
      ["Biker shorts in Cinnamon","SRT_126","shorts","#8a5636","#e8e5df","Brown","Bottoms","Elastane","Training"],
      ["Track pants in Mustard","PNT_127","pants","#e3b11f","#efedea","Yellow","Bottoms","Polyester","Lifestyle"],
      ["Sweatpants in Toffee","SWP_128","pants","#9a6640","#ebe8e3","Brown","Bottoms","Fleece","Lifestyle"],
      ["Fleece hoodie in Cognac","HOD_129","long","#b0602a","#b8b9bb","Brown","Outerwear","Fleece","Lifestyle"],
      ["Puffer vest in Amber","VST_130","vest","#e08a1e","#151515","Orange","Outerwear","Nylon","Outdoor"],
      ["Track jacket in Brick Red","JKT_131","long","#b53a2e","#e9e9e9","Red","Outerwear","Polyester","Lifestyle"],
      ["Training shorts in Rust","SRT_132","shorts","#c4602f","#ece9e4","Orange","Bottoms","Polyester","Training"],
      ["Half-zip pullover in Latte","TOP_133","long","#c9a27a","#e9e5de","Neutral","Tops","Fleece","Lifestyle"],
      ["Sweatpants in Caramel","SWP_134","pants","#c88a5a","#ece8e1","Brown","Bottoms","Fleece","Lifestyle"],
      ["Dri-FIT training tee in Peach","TOP_135","tee","#f2a65a","#5a5a5a","Orange","Tops","Polyester","Training"],
      ["Performance tank in Coral","TAN_136","tank","#d97c4a","#e6e1d8","Orange","Tops","Polyester","Training"],
    ].map(([name, sku, s, c, bg, fam, cat, mat, fn]) => ({ name, sku, s, c, bg, fam, cat, mat, fn }));

    const ATTRS = [
      { k: "fam", label: "Color" },
      { k: "cat", label: "Category" },
      { k: "mat", label: "Material" },
      { k: "fn", label: "Function" },
    ];
    const attrLabel = k => ATTRS.find(a => a.k === k).label;
    const famColor = { Red: "#b53a2e", Orange: "#f08a3c", Yellow: "#e3b11f", Brown: "#8a5636", Pink: "#d0368f", Neutral: "#e2d9c8" };
    const VALUES = {
      fam: Object.keys(famColor),
      cat: ["Tops", "Bottoms", "Outerwear", "Bras"],
      mat: ["Polyester", "Fleece", "Nylon", "Elastane", "Cotton"],
      fn: ["Training", "Lifestyle", "Outdoor"],
    };
    const warm = ["Red", "Orange", "Yellow", "Brown", "Pink"];
    const PRESETS = { fam: [["Warm colors", warm], ["Neutrals", ["Neutral"]]] };
    const COLS = [["name", "Product"], ["sku", "SKU"], ["cat", "Category"], ["fam", "Color"], ["mat", "Material"], ["fn", "Function"]];
    const colName = k => COLS.find(c => c[0] === k)[1];

    const STYLES = {
      A: { name: "Pill dropdowns", sub: "One dropdown per attribute",
        why: ["Each attribute and its value sit together in one pill (\"Color: Warm colors\"), so there's no guessing which value belongs where.",
              "Unset attributes still show as pills, so people can see what they're able to filter by.",
              "Counts beside each value preview the result before you tick it, and update as other filters change."],
        watch: ["The row runs out of room after about 5 attributes and needs a \"More\" overflow.",
                "Each attribute is a separate click to open."] },
      B: { name: "Filter panel", sub: "One button, two-pane menu",
        why: ["Scales to dozens of attributes without crowding the toolbar.",
              "Active filters show as removable chips, so the toolbar only shows what's applied.",
              "Changing several attributes happens in one place, with a clear \"Show N products\" at the end."],
        watch: ["Values are hidden until the panel is opened, so it's harder to discover what you can filter by.",
                "An extra click compared with pills for one quick change."] },
      C: { name: "Query builder", sub: "Filters read as sentences",
        why: ["Reads like a sentence: \"Color is any of Red, Orange +3\". It's the clearest way to show what's applied.",
              "Click \"is any of\" to flip it to \"is not\". Excluding values is a fast way to find gaps (e.g. Category is not Tops).",
              "Only the attributes you add take up space."],
        watch: ["Steeper learning curve for casual users.",
                "Denser toolbar, so it's best for power users like merchandisers."] },
      D: { name: "Value chips", sub: "No dropdowns, values always visible",
        why: ["Zero clicks to see every value: pick an attribute tab and its values appear as chips.",
              "Fastest for small value sets, and colour swatches are easy to scan.",
              "Counts and greyed-out empty values show depth and gaps at a glance."],
        watch: ["Uses a second toolbar row, so there's less room for products.",
                "Doesn't scale to attributes with 20+ values; it would need search or wrapping."] },
    };

    const S = {
      style: "A", view: "grid", key: "name", dir: 1, q: "",
      sel: new Set(["TOP_123", "VST_130"]),
      f: { fam: new Set(warm), cat: new Set(), mat: new Set(), fn: new Set() },
      neg: { fam: false, cat: false, mat: false, fn: false },
      tokens: ["fam"], open: null, focus: "fam", tab: "fam",
    };

    const ic = {
      back: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>',
      chev: '<svg class="i" style="width:12px;height:12px" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 4.5 3 3 3-3"/></svg>',
      search: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>',
      plus: '<svg class="i" style="width:14px;height:14px" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 1.5v11M1.5 7h11"/></svg>',
      dl: '<svg class="i" viewBox="0 0 16 16" fill="currentColor"><path d="M7.25 1.5h1.5v6.19l2.22-2.22 1.06 1.06L8 10.56 3.97 6.53l1.06-1.06 2.22 2.22zM2 10h1.5v2.5h9V10H14v4H2z"/></svg>',
      grid: '<svg class="i" viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>',
      list: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>',
      sort: '<svg class="i" style="width:14px;height:14px" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 3v10M2.5 10.5 5 13l2.5-2.5M11 13V3M8.5 5.5 11 3l2.5 2.5"/></svg>',
      filter: '<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>',
      check: '<svg class="i" style="width:14px;height:14px" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7.5 2.5 2.5L11 4.5"/></svg>',
    };

    /* ---------- Filtering ---------- */
    const matches = (i, except) => {
      if (S.q) { const q = S.q.toLowerCase(); if (!i.name.toLowerCase().includes(q) && !i.sku.toLowerCase().includes(q)) return false; }
      return ATTRS.every(({ k }) => {
        if (k === except || !S.f[k].size) return true;
        const has = S.f[k].has(i[k]);
        return S.neg[k] ? !has : has;
      });
    };
    const countFor = (k, v) => items.filter(i => i[k] === v && matches(i, k)).length;
    const sameSet = (set, arr) => set.size === arr.length && arr.every(v => set.has(v));
    const activeCount = () => ATTRS.filter(({ k }) => S.f[k].size).length;
    const valueLabel = k => {
      const set = S.f[k];
      if (!set.size) return "";
      const preset = (PRESETS[k] || []).find(([, vals]) => sameSet(set, vals));
      if (preset) return preset[0];
      const vals = VALUES[k].filter(v => set.has(v));
      return vals.length <= 2 ? vals.join(", ") : `${vals[0]} +${vals.length - 1}`;
    };
    const visible = () => items.filter(i => matches(i)).sort((a, b) => a[S.key].localeCompare(b[S.key]) * S.dir);

    /* ---------- Pieces ---------- */
    const thumb = i => `<div class="th" style="--bg:${i.bg};--c:${i.c}"><svg><use href="#${i.s}"/></svg></div>`;
    const swatch = (k, v) => k === "fam" ? `<span class="sw" style="background:${famColor[v]}"></span>` : "";
    const searchBox = () => `<label class="search">${ic.search}<input class="q" placeholder="Search products or SKUs" value="${S.q.replace(/"/g, "&quot;")}"></label>`;
    const sortBtn = () => `<button class="btn ghost" data-act="open" data-pop="sort">${ic.sort} ${colName(S.key)} ${S.dir > 0 ? "A–Z" : "Z–A"} ${ic.chev}</button>`;
    const countMeta = n => `<span class="meta"><b>${n}</b> of ${items.length}</span>`;

    const valueRows = k => {
      const presets = PRESETS[k] ? `<div class="preset">${PRESETS[k].map(([name, vals], idx) =>
        `<span class="${sameSet(S.f[k], vals) ? "on" : ""}" data-act="preset" data-k="${k}" data-i="${idx}">${name}</span>`).join("")}</div>` : "";
      return presets + VALUES[k].map(v => {
        const n = countFor(k, v);
        return `<div class="opt${n ? "" : " zero"}" data-act="toggle" data-k="${k}" data-v="${v}"><span class="cb${S.f[k].has(v) ? " on" : ""}"></span>${swatch(k, v)}${v}<span class="n">${n}</span></div>`;
      }).join("");
    };

    /* ---------- Toolbars per style ---------- */
    const toolbars = {
      A: () => `
        <div class="tb">
          ${searchBox()}
          ${ATTRS.map(({ k, label }) => {
            const val = valueLabel(k);
            return `<button class="pill${val ? " on" : ""}${S.open === "vals:" + k ? " open" : ""}" data-act="open" data-pop="vals:${k}">${label}${val ? `: <b>${val}</b>` : ""} ${ic.chev}</button>`;
          }).join("")}
          <span class="sp"></span>${countMeta(visible().length)}${sortBtn()}
        </div>`,
      B: () => {
        const n = activeCount();
        return `
        <div class="tb">
          ${searchBox()}
          <button class="btn" data-act="open" data-pop="panel">${ic.filter} Filters ${n ? `<span class="badge">${n}</span>` : ""} ${ic.chev}</button>
          ${ATTRS.filter(({ k }) => S.f[k].size).map(({ k, label }) =>
            `<span class="chip" data-act="open" data-pop="panel" data-k="${k}">${label}: <b>${valueLabel(k)}</b><span class="x" data-act="remove" data-k="${k}" aria-label="Remove">×</span></span>`).join("")}
          ${n > 1 ? `<a class="link" data-act="clearall">Clear all</a>` : ""}
          <span class="sp"></span>${countMeta(visible().length)}${sortBtn()}
        </div>`;
      },
      C: () => `
        <div class="tb" style="flex-wrap:wrap">
          ${searchBox()}
          ${S.tokens.map(k => `
            <span class="tok${S.neg[k] ? " neg" : ""}">
              <span class="k">${swatch(k, [...S.f[k]][0] || "")}${attrLabel(k)}</span>
              <button class="op" data-act="neg" data-k="${k}" title="Click to switch between include and exclude">${S.neg[k] ? "is not" : "is any of"}</button>
              <button class="v${S.f[k].size ? "" : " empty-v"}" data-act="open" data-pop="vals:${k}">${valueLabel(k) || "choose…"}</button>
              <button class="x" data-act="remove" data-k="${k}" aria-label="Remove filter">×</button>
            </span>`).join("")}
          ${S.tokens.length < ATTRS.length ? `<button class="btn ghost" data-act="open" data-pop="add">${ic.plus} Filter</button>` : ""}
          <span class="sp"></span>${countMeta(visible().length)}${sortBtn()}
        </div>`,
      D: () => `
        <div class="tb">
          ${searchBox()}
          <span class="divider"></span>
          ${ATTRS.map(({ k, label }) => `<button class="atab${S.tab === k ? " on" : ""}" data-act="tab" data-k="${k}">${label}${S.f[k].size ? ` <span class="badge">${S.f[k].size}</span>` : ""}</button>`).join("")}
          <span class="sp"></span>${countMeta(visible().length)}${sortBtn()}
        </div>
        <div class="tb2">
          ${(PRESETS[S.tab] || []).map(([name, vals], idx) =>
            `<button class="vchip preset-chip${sameSet(S.f[S.tab], vals) ? " on" : ""}" data-act="preset" data-k="${S.tab}" data-i="${idx}">${name}</button>`).join("")}
          ${PRESETS[S.tab] ? `<span class="divider"></span>` : ""}
          <button class="vchip${S.f[S.tab].size ? "" : " on"}" data-act="clear" data-k="${S.tab}">All</button>
          ${VALUES[S.tab].map(v => {
            const n = countFor(S.tab, v);
            return `<button class="vchip${S.f[S.tab].has(v) ? " on" : ""}${n ? "" : " zero"}" data-act="toggle" data-k="${S.tab}" data-v="${v}">${swatch(S.tab, v)}${v}<span class="n">${n}</span></button>`;
          }).join("")}
          ${activeCount() ? `<span class="sp" style="flex:1"></span><a class="link" data-act="clearall">Clear all filters</a>` : ""}
        </div>`,
    };

    /* ---------- Popovers ---------- */
    const popover = () => {
      if (!S.open) return "";
      if (S.open.startsWith("vals:")) {
        const k = S.open.slice(5);
        return `<div class="pop"><div class="pop-h">${attrLabel(k)}${S.f[k].size ? `<a data-act="clear" data-k="${k}">Clear</a>` : ""}</div>${valueRows(k)}</div>`;
      }
      if (S.open === "panel") {
        return `<div class="pop panel">
          <div class="panel-body">
            <div class="pane-l">${ATTRS.map(({ k, label }) =>
              `<div class="opt${S.focus === k ? " cur" : ""}" data-act="focus" data-k="${k}">${label}${S.f[k].size ? `<span class="n"><span class="badge">${S.f[k].size}</span></span>` : ""}</div>`).join("")}</div>
            <div class="pane-r">${valueRows(S.focus)}</div>
          </div>
          <div class="pop-f"><a class="link" data-act="clearall">Clear all</a><button class="btn primary" data-act="close">Show ${visible().length} products</button></div>
        </div>`;
      }
      if (S.open === "add") {
        return `<div class="pop" style="width:200px"><div class="pop-h">Add filter</div>${ATTRS.filter(({ k }) => !S.tokens.includes(k)).map(({ k, label }) =>
          `<div class="opt" data-act="addattr" data-k="${k}">${label}</div>`).join("")}</div>`;
      }
      if (S.open === "sort") {
        return `<div class="pop" style="width:220px"><div class="pop-h">Sort by</div>
          ${COLS.map(([k, l]) => `<div class="opt" data-act="sortby" data-key="${k}">${l}${S.key === k ? `<span class="chk">${ic.check}</span>` : ""}</div>`).join("")}
          <div class="sep"></div>
          <div class="opt" data-act="sortdir" data-dir="1">A → Z${S.dir > 0 ? `<span class="chk">${ic.check}</span>` : ""}</div>
          <div class="opt" data-act="sortdir" data-dir="-1">Z → A${S.dir < 0 ? `<span class="chk">${ic.check}</span>` : ""}</div>
        </div>`;
      }
      return "";
    };

    /* ---------- Views ---------- */
    const gridView = list => `<div class="vgrid">${list.map(i => `
      <div class="vcard${S.sel.has(i.sku) ? " sel" : ""}" data-act="item" data-sku="${i.sku}">
        <span class="pick"></span>${thumb(i)}<h3>${i.name}</h3>
        <span class="sku">${i.sku}</span>
        <span class="attrs"><span class="sw" style="background:${i.c}"></span>${i.cat} · ${i.mat}</span>
      </div>`).join("")}</div>`;

    const tableView = list => {
      const allOn = list.length && list.every(i => S.sel.has(i.sku));
      return `<table class="t"><thead><tr>
          <th class="w-cb"><span class="cb${allOn ? " on" : ""}" data-act="all"></span></th>
          ${COLS.map(([k, l]) => `<th class="${S.key === k ? "sorted" : ""}" data-act="th" data-key="${k}">${l}${S.key === k ? (S.dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("")}
        </tr></thead><tbody>${list.map(i => `
          <tr class="${S.sel.has(i.sku) ? "on" : ""}" data-act="item" data-sku="${i.sku}">
            <td><span class="cb${S.sel.has(i.sku) ? " on" : ""}"></span></td>
            <td><div class="prod">${thumb(i)}${i.name}</div></td><td class="sku">${i.sku}</td><td>${i.cat}</td>
            <td><span class="tag"><span class="sw" style="background:${i.c}"></span>${i.fam}</span></td><td>${i.mat}</td><td>${i.fn}</td>
          </tr>`).join("")}</tbody></table>`;
    };

    const footer = list => {
      const n = S.sel.size;
      if (n) return `
        <div class="ft selbar"><span class="meta"><b>${n} selected</b><a data-act="selall">Select all ${list.length} shown</a><a data-act="selclear">Clear</a></span>
          <div class="actions"><button class="btn">${ic.dl} Export ${n} as CSV</button><button class="btn primary">${ic.plus} Create collection (${n})</button></div></div>`;
      return `
        <div class="ft"><span class="meta">${list.length} of ${items.length} products · sorted by ${colName(S.key)}</span>
          <div class="actions"><button class="btn">${ic.dl} Export as CSV</button><button class="btn primary">${ic.plus} New Attribute Collection</button></div></div>`;
    };

    /* ---------- Render ---------- */
    const app = document.getElementById("app");
    const render = () => {
      const list = visible();
      const body = !list.length
        ? `<div class="empty"><b>No products match</b><span>Try removing a filter or changing your search.</span><button class="btn" data-act="clearall">Clear filters</button></div>`
        : S.view === "grid" ? gridView(list) : tableView(list);
      app.innerHTML = `
        <div class="m">
          <div class="hd">
            <button class="back" aria-label="Back">${ic.back}</button>
            <h2><span>Custom Attributes /</span> Consumer Preferences</h2>
            <div class="seg" aria-label="View">
              <button class="${S.view === "grid" ? "on" : ""}" data-act="view" data-view="grid">${ic.grid} Grid</button>
              <button class="${S.view === "table" ? "on" : ""}" data-act="view" data-view="table">${ic.list} Table</button>
            </div>
          </div>
          ${toolbars[S.style]()}
          <div class="body" style="${S.view === "table" && list.length ? "background:var(--surface)" : ""}">${body}</div>
          ${footer(list)}
          ${popover()}
        </div>`;
      placePopover();
      renderChrome();
    };

    const placePopover = () => {
      const pop = app.querySelector(".pop");
      if (!pop) return;
      const m = app.querySelector(".m");
      const anchor = m.querySelector(`.tb [data-pop="${S.open}"]`) || m.querySelector(`[data-pop="${S.open}"]`);
      if (!anchor) { S.open = null; pop.remove(); return; }
      const mr = m.getBoundingClientRect(), ar = anchor.getBoundingClientRect();
      let left = ar.left - mr.left;
      if (left + pop.offsetWidth > mr.width - 12) left = ar.right - mr.left - pop.offsetWidth;
      pop.style.left = left + "px";
      pop.style.top = ar.bottom - mr.top + 6 + "px";
    };

    const renderChrome = () => {
      document.getElementById("styles").innerHTML = Object.entries(STYLES).map(([id, s]) =>
        `<button class="style-btn${S.style === id ? " on" : ""}" data-style="${id}"><b>${id} · ${s.name}</b><span>${s.sub}</span></button>`).join("");
      const s = STYLES[S.style];
      document.getElementById("notes").innerHTML = `
        <div><h3>Why try it</h3><ul>${s.why.map(t => `<li>${t}</li>`).join("")}</ul></div>
        <div><h3>Watch out for</h3><ul>${s.watch.map(t => `<li>${t}</li>`).join("")}</ul></div>`;
    };

    /* ---------- Events ---------- */
    app.addEventListener("click", e => {
      const t = e.target;
      const a = t.closest("[data-act]");
      const inPop = t.closest(".pop");
      if (S.open && !inPop && !(a && a.dataset.act === "open")) {
        S.open = null;
        if (!a) { render(); if (t.closest(".search")) app.querySelector(".q").focus(); return; }
      }
      if (!a) return;
      const { act, k, v } = a.dataset;
      switch (act) {
        case "open": {
          const pop = a.dataset.pop;
          if (k) S.focus = k;
          S.open = S.open === pop && !k ? null : pop;
          break;
        }
        case "close": S.open = null; break;
        case "toggle": S.f[k].has(v) ? S.f[k].delete(v) : S.f[k].add(v); break;
        case "preset": {
          const vals = PRESETS[k][+a.dataset.i][1];
          S.f[k] = sameSet(S.f[k], vals) ? new Set() : new Set(vals);
          break;
        }
        case "clear": S.f[k].clear(); break;
        case "clearall": ATTRS.forEach(({ k }) => { S.f[k].clear(); S.neg[k] = false; }); S.q = ""; S.open = null; break;
        case "remove":
          e.stopPropagation();
          S.f[k].clear(); S.neg[k] = false;
          S.tokens = S.tokens.filter(x => x !== k);
          S.open = null;
          break;
        case "focus": S.focus = k; break;
        case "neg": S.neg[k] = !S.neg[k]; break;
        case "addattr": S.tokens.push(k); S.open = "vals:" + k; break;
        case "tab": S.tab = k; break;
        case "sortby": S.key = a.dataset.key; S.open = null; break;
        case "sortdir": S.dir = +a.dataset.dir; S.open = null; break;
        case "th": S.dir = S.key === a.dataset.key ? -S.dir : 1; S.key = a.dataset.key; break;
        case "view": S.view = a.dataset.view; break;
        case "item": { const s = a.dataset.sku; S.sel.has(s) ? S.sel.delete(s) : S.sel.add(s); break; }
        case "all": {
          const list = visible();
          const allOn = list.every(i => S.sel.has(i.sku));
          list.forEach(i => allOn ? S.sel.delete(i.sku) : S.sel.add(i.sku));
          break;
        }
        case "selall": visible().forEach(i => S.sel.add(i.sku)); break;
        case "selclear": S.sel.clear(); break;
        default: return;
      }
      render();
    });

    app.addEventListener("input", e => {
      if (!e.target.matches(".q")) return;
      S.q = e.target.value;
      render();
      const q = app.querySelector(".q");
      q.focus();
      q.setSelectionRange(q.value.length, q.value.length);
    });

    document.addEventListener("keydown", e => { if (e.key === "Escape" && S.open) { S.open = null; render(); } });

    document.getElementById("styles").addEventListener("click", e => {
      const b = e.target.closest("[data-style]");
      if (!b) return;
      S.style = b.dataset.style;
      S.open = null;
      // Query builder shows a token for every attribute that already has values
      S.tokens = ATTRS.map(a => a.k).filter(k => S.f[k].size || S.tokens.includes(k));
      history.replaceState(null, "", "#" + S.style);
      render();
    });

    const fromHash = location.hash.slice(1);
    if (STYLES[fromHash]) S.style = fromHash;
    render();
  </script>
</body>
</html>
